[project]
name = "regscope"
version = "0.1.0"
description = "Change-aware regression test selection for API services"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -p no:cacheprovider --basetemp=.pytest-tmp"
